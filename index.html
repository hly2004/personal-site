<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="数学研究者个人主页">
  <title>数学研究者个人主页</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Serif+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav id="navbar">
    <div class="nav-inner">
      <span class="nav-brand"></span>
      <ul class="nav-links">
        <li><a href="#about" class="nav-link">简介</a></li>
        <li><a href="#papers" class="nav-link">成果</a></li>
        <li><a href="#contact" class="nav-link">联系</a></li>
      </ul>
    </div>
  </nav>

  <main>
    <header id="hero">
      <div class="hero-bg"></div>
      <div class="hero-content">
        <h1 class="hero-name"></h1>
        <p class="hero-title"></p>
        <p class="hero-tagline"></p>
      </div>
    </header>

    <section id="about">
      <div class="section-inner">
        <h2 class="section-heading">关于我</h2>
        <div class="about-bio"></div>
        <div class="about-interests">
          <h3>研究方向</h3>
          <ul class="interests-list"></ul>
        </div>
        <div class="about-education">
          <h3>教育背景</h3>
          <ul class="education-list"></ul>
        </div>
      </div>
    </section>

    <section id="papers">
      <div class="section-inner">
        <h2 class="section-heading">学术成果</h2>
        <div class="papers-list"></div>
        <h3 class="projects-heading">研究项目</h3>
        <div class="projects-list"></div>
      </div>
    </section>

    <section id="contact">
      <div class="section-inner">
        <h2 class="section-heading">联系方式</h2>
        <div class="contact-info">
          <div class="contact-email"></div>
          <div class="contact-links"></div>
        </div>
      </div>
    </section>
  </main>

  <footer id="footer">
    <p class="copyright"></p>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
